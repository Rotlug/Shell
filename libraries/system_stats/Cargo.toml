[package]
name = "system_stats"
version = "0.1.0"
edition = "2024"

[features]
default = ["nvidia"]
# GPU memory of NVIDIA cards. The driver's library is loaded at runtime, so nothing needs to
# be installed to build with this.
nvidia = ["dep:nvml-wrapper"]

[dependencies]
nvml-wrapper = { version = "0.11.0", optional = true }
sysinfo = "0.37.2"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["sync"] }
