[package]
name = "gray-meadows-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-broadcast = "0.7.2"
async-channel = "2.5.0"
cairo-rs = "0.21.5"
chrono = "0.4.45"
dbus = "0.9.12"
dbus-crossroads = "0.5.3"
dbus-tokio = "0.7.6"
futures-signals = "0.3.34"
gdk = { version = "0.10.3", package = "gdk4" }
gio = "0.21.5"
glib = "0.21.5"
graphene-rs = "0.21.5"
gsk = { version = "0.10.3", package = "gsk4" }
gtk = { version = "0.10.3", features = ["v4_8"], package = "gtk4" }
gtk4-layer-shell = "0.7.1"
hyprland = "0.4.0-beta.3"
niri-ipc = "26.4.0"
image = "0.25.10"
libadwaita = { version = "0.8.1", features = ["v1_4", "v1_7"] }
libc = "0.2.189"
notify = "8.2.0"
num-traits = "0.2.19"
nvml-wrapper = "0.11.0"
pwmixer = { git = "https://github.com/Rotlug/shell.git" }
regex = "1.13.1"
relm4 = "0.10.1"
relm4-macros = "0.10.1"
sensors = "0.2.2"
shlex = "1.3.0"
sysinfo = "0.37.2"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
urlencoding = "2.1.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
