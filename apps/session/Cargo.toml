[package]
name = "gms-session"
version = "0.1.0"
edition = "2024"
description = "The logout selector of Gray Meadows: lock, log out, suspend, hibernate, reboot or shut down"

[dependencies]
gdk = { version = "0.10.3", package = "gdk4" }
gio = "0.21.5"
glib = "0.21.5"
gms_ui = { path = "../../crates/gms_ui" }
gtk = { version = "0.10.3", features = ["v4_8"], package = "gtk4" }
gtk4-layer-shell = "0.7.1"
